name: Android APK Generalas

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Mappaszerkezet ellenorzese
      run: ls -la

    - name: Java beallitasa
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle futtatasi jog megadasa
      run: chmod +x gradlew || true

    - name: APK buildelese
      run: ./gradlew assembleDebug
ű
